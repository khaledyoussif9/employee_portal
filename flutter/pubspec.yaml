name: employee_portal
description: المنظومة الإلكترونية الموحدة - منطقة الدلتا
publish_to: "none"
version: 2.2.0+24

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  file_picker: ^10.3.10
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/company_logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/company_logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/delta_logo.png
    - assets/company_logo.jpg
    - assets/login_bg_reference_v2.jpg
    - assets/industrial/
